name: Validate application
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: cp .env.example apps/web/.env.local
      - run: bun run storage:up
      - run: docker build --tag quacklytics-image-test .
      - uses: ./.github/actions/playwright
      - run: bun run test:image
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: image-playwright-report-${{ matrix.runner }}
          path: |
            playwright-report/
            test-results/
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check:boundaries
      - run: bun run test:unit
  e2e:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: cp .env.example apps/web/.env.local
      - run: bun run storage:up
      - run: bun run build
      - uses: ./.github/actions/playwright
      - run: bun run test:e2e --shard=${{ matrix.shard }}/4
      # Blob reports carry traces and screenshots; e2e-report merges them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
  e2e-report:
    needs: e2e
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: bunx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
