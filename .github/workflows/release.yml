# Nightly: every push to master publishes @quacklytics/client@<next>-nightly.sha-<sha> (npm dist-tag
# "nightly") and ghcr.io/xz3dev/quacklytics (amd64 + arm64) tagged "nightly" and <sha>.
# Release: publishing a GitHub release with a vX.Y.Z tag runs full CI, then publishes the client at X.Y.Z
# ("latest", or "next" for vX.Y.Z-prerelease) and the Docker image tagged X.Y.Z, X.Y and latest.
name: Release
on:
  push:
    branches: [master]
  release:
    types: [published]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/xz3dev/quacklytics
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - id: version
        run: bun scripts/set-client-version.ts ${{ github.event_name == 'release' && 'release' || 'nightly' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  # Nightlies rely on the CI run already triggered by the push; releases re-run it on the tagged commit.
  ci:
    needs: version
    if: github.event_name == 'release'
    uses: ./.github/workflows/ci.yml

  client-check:
    needs: version
    uses: ./.github/workflows/client.yml

  publish-client:
    needs: [version, ci, client-check]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - run: bun scripts/set-client-version.ts ${{ github.event_name == 'release' && 'release' || 'nightly' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: bun run check:client
      - id: pack
        working-directory: packages/tracker
        run: echo "tarball=$RUNNER_TEMP/$(npm pack --json --pack-destination "$RUNNER_TEMP" | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"
      # Authenticates through npm trusted publishing (OIDC); no token secret is used.
      - run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public --tag ${{ needs.version.outputs.dist-tag }}
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pack.outputs.tarball }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Each architecture builds on a native runner (DuckDB's native bindings are installed per platform)
  # and is pushed untagged by digest; docker-manifest then publishes one multi-arch image.
  docker:
    needs: [version, ci]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          provenance: false
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [version, docker]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.dist-tag == 'latest' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - run: docker buildx imagetools inspect "$IMAGE:$(jq -r '.version' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
